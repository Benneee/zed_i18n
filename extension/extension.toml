id = "i18n-lsp"
name = "i18n LSP"
version = "0.0.1"
schema_version = 1
authors = ["Benedict <benedictiknkeonye@gmail.com>"]
description = "Shows the translations of an i18n key in every language on hover."
repository = "https://github.com/Benneee/zed_i18n"

[language_servers.i18n-lsp]
name = "i18n LSP"
languages = [
    "TypeScript", "TSX", "JavaScript",
    "Vue.js",
    "Handlebars", "Glimmer (JavaScript)", "Glimmer (TypeScript)",
    "Angular", "HTML",
]
